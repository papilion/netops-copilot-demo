! edge1 - AS64496 border router (SAMPLE / FICTIONAL DATA)
hostname edge1
!
interface Loopback0
 ip address 192.0.2.3 255.255.255.255
!
interface GigabitEthernet0/0
 description to core1
 ip address 10.255.0.6 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/1
 description to core2
 ip address 10.255.0.10 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/2
 description eBGP to peer1 (AS64497)
 ip address 198.51.100.1 255.255.255.252
!
interface GigabitEthernet0/3
 description eBGP to cust1 (AS64498)
 ip address 198.51.100.5 255.255.255.252
!
router ospf 1
 router-id 192.0.2.3
 network 10.255.0.0 0.0.0.255 area 0
 network 192.0.2.3 0.0.0.0 area 0
!
ip route 192.0.2.0 255.255.255.0 Null0
!
router bgp 64496
 bgp router-id 192.0.2.3
 network 192.0.2.0 mask 255.255.255.0
 neighbor 192.0.2.1 remote-as 64496
 neighbor 192.0.2.1 update-source Loopback0
 neighbor 192.0.2.1 next-hop-self
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.2 update-source Loopback0
 neighbor 192.0.2.2 next-hop-self
 neighbor 198.51.100.2 remote-as 64497
 neighbor 198.51.100.2 description peer1 upstream
 neighbor 198.51.100.6 remote-as 64498
 neighbor 198.51.100.6 description cust1 customer
!
end
