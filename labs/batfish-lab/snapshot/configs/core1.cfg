! core1 - AS64496 core router (SAMPLE / FICTIONAL DATA)
hostname core1
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
interface GigabitEthernet0/0
 description to core2
 ip address 10.255.0.1 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/1
 description to edge1
 ip address 10.255.0.5 255.255.255.252
 ip ospf cost 10
!
router ospf 1
 router-id 192.0.2.1
 network 10.255.0.0 0.0.0.255 area 0
 network 192.0.2.1 0.0.0.0 area 0
!
router bgp 64496
 bgp router-id 192.0.2.1
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.2 update-source Loopback0
 neighbor 192.0.2.3 remote-as 64496
 neighbor 192.0.2.3 update-source Loopback0
!
end
