! core2 - AS64496 core router (SAMPLE / FICTIONAL DATA)
hostname core2
!
interface Loopback0
 ip address 192.0.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 description to core1
 ip address 10.255.0.2 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/1
 description to edge1
 ip address 10.255.0.9 255.255.255.252
 ip ospf cost 10
!
router ospf 1
 router-id 192.0.2.2
 network 10.255.0.0 0.0.0.255 area 0
 network 192.0.2.2 0.0.0.0 area 0
!
router bgp 64496
 bgp router-id 192.0.2.2
 neighbor 192.0.2.1 remote-as 64496
 neighbor 192.0.2.1 update-source Loopback0
 neighbor 192.0.2.3 remote-as 64496
 neighbor 192.0.2.3 update-source Loopback0
!
end
