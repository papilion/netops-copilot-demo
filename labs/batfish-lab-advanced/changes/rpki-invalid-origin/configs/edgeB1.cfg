! edgeB1 - AS64496 (SAMPLE / FICTIONAL DATA)
! RPKI enforcement (honest split): Batfish does NOT compute an ROV
! state, so the validation decision comes from the fictional ROA table
! (roas.json: 203.0.113.0/24 -> AS64498 only, maxLength 24).
! peer2 (AS64499) announces the more-specific 203.0.113.0/25: invalid
! on TWO counts — origin AS64499 != ROA AS64498, and /25 exceeds the
! ROA maxLength 24. (An exact /24 announcement from peer2 never
! becomes best at edgeB1 because the legitimate direct cust1 route
! wins, so it is unobservable in the RIB; the more-specific is the
! live-observable invalid case.) This route-map is the ENFORCEMENT
! that a real router applies after ROV marks a route invalid: deny
! the /25 when it arrives from peer2 with origin AS64499, permit
! everything else.
! It is applied inbound on the peer2 neighbour only.
hostname edgeB1
!
interface Loopback0
 ip address 192.0.2.7 255.255.255.255
!
interface GigabitEthernet0/0
 description to coreB1
 ip address 10.255.1.34 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/1
 description to coreB2
 ip address 10.255.1.38 255.255.255.252
 ip ospf cost 10
!
interface GigabitEthernet0/2
 description to peer2
 ip address 198.51.100.9 255.255.255.252
!
interface GigabitEthernet0/3
 description to cust2
 ip address 198.51.100.13 255.255.255.252
!
interface GigabitEthernet0/4
 description to cust1
 ip address 198.51.100.17 255.255.255.252
!
router ospf 1
 router-id 192.0.2.7
 network 192.0.2.7 0.0.0.0 area 20
 network 10.255.1.32 0.0.0.3 area 20
 network 10.255.1.36 0.0.0.3 area 20
!

ip prefix-list ROV-CUST1 seq 5 permit 203.0.113.0/25
ip as-path access-list 1 permit ^64499$
route-map ROV-IN deny 10
 match ip address prefix-list ROV-CUST1
 match as-path 1
route-map ROV-IN permit 20
router bgp 64496
 bgp router-id 192.0.2.7
 neighbor 192.0.2.8 remote-as 64496
 neighbor 192.0.2.8 update-source Loopback0
 neighbor 192.0.2.8 next-hop-self
 neighbor 198.51.100.10 remote-as 64499
 neighbor 198.51.100.10 description peer2 upstream
 neighbor 198.51.100.10 route-map ROV-IN in
 neighbor 198.51.100.14 remote-as 64500
 neighbor 198.51.100.14 description cust2 customer
 neighbor 198.51.100.18 remote-as 64498
 neighbor 198.51.100.18 description cust1 customer second link
!
end
