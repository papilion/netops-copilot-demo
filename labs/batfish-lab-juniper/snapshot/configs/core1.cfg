# core1 - AS64496 core router (SAMPLE / FICTIONAL DATA)
set system host-name core1
set interfaces lo0 unit 0 family inet address 192.0.2.1/32
set interfaces ge-0/0/0 unit 0 description "to core2"
set interfaces ge-0/0/0 unit 0 family inet address 10.255.0.1/30
set interfaces ge-0/0/1 unit 0 description "to edge1"
set interfaces ge-0/0/1 unit 0 family inet address 10.255.0.5/30
set routing-options router-id 192.0.2.1
set routing-options autonomous-system 64496
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 metric 10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 metric 10
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 192.0.2.1
set protocols bgp group IBGP export IBGP-EXPORT
set protocols bgp group IBGP neighbor 192.0.2.2 peer-as 64496
set protocols bgp group IBGP neighbor 192.0.2.3 peer-as 64496
set policy-options policy-statement IBGP-EXPORT term BGP from protocol bgp
set policy-options policy-statement IBGP-EXPORT term BGP then accept
set policy-options policy-statement IBGP-EXPORT term FINAL then reject
