# edge1 - AS64496 border router (SAMPLE / FICTIONAL DATA)
set system host-name edge1
set interfaces lo0 unit 0 family inet address 192.0.2.3/32
set interfaces ge-0/0/0 unit 0 description "to core1"
set interfaces ge-0/0/0 unit 0 family inet address 10.255.0.6/30
set interfaces ge-0/0/1 unit 0 description "to core2"
set interfaces ge-0/0/1 unit 0 family inet address 10.255.0.10/30
set interfaces ge-0/0/2 unit 0 description "eBGP to peer1 (AS64497)"
set interfaces ge-0/0/2 unit 0 family inet address 198.51.100.1/30
set interfaces ge-0/0/3 unit 0 description "eBGP to cust1 (AS64498)"
set interfaces ge-0/0/3 unit 0 family inet address 198.51.100.5/30
set routing-options router-id 192.0.2.3
set routing-options autonomous-system 64496
set routing-options static route 192.0.2.0/24 discard
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 metric 10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 metric 10
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 192.0.2.3
set protocols bgp group IBGP export IBGP-EXPORT-EDGE
set protocols bgp group IBGP neighbor 192.0.2.1 peer-as 64496
set protocols bgp group IBGP neighbor 192.0.2.2 peer-as 64496
set protocols bgp group PEER1 type external
set protocols bgp group PEER1 local-address 198.51.100.1
set protocols bgp group PEER1 export EBGP-EXPORT
set protocols bgp group PEER1 neighbor 198.51.100.2 peer-as 64497
set protocols bgp group CUST1 type external
set protocols bgp group CUST1 local-address 198.51.100.5
set protocols bgp group CUST1 export EBGP-EXPORT
set protocols bgp group CUST1 neighbor 198.51.100.6 peer-as 64498
set policy-options policy-statement IBGP-EXPORT-EDGE term BGP from protocol bgp
set policy-options policy-statement IBGP-EXPORT-EDGE term BGP then next-hop self
set policy-options policy-statement IBGP-EXPORT-EDGE term BGP then accept
set policy-options policy-statement IBGP-EXPORT-EDGE term STATIC from protocol static
set policy-options policy-statement IBGP-EXPORT-EDGE term STATIC from route-filter 192.0.2.0/24 exact
set policy-options policy-statement IBGP-EXPORT-EDGE term STATIC then next-hop self
set policy-options policy-statement IBGP-EXPORT-EDGE term STATIC then accept
set policy-options policy-statement IBGP-EXPORT-EDGE term FINAL then reject
set policy-options policy-statement EBGP-EXPORT term BGP from protocol bgp
set policy-options policy-statement EBGP-EXPORT term BGP then accept
set policy-options policy-statement EBGP-EXPORT term ORIGIN-STATIC from protocol static
set policy-options policy-statement EBGP-EXPORT term ORIGIN-STATIC from route-filter 192.0.2.0/24 exact
set policy-options policy-statement EBGP-EXPORT term ORIGIN-STATIC then accept
set policy-options policy-statement EBGP-EXPORT term FINAL then reject
