! core1 - PROPOSED CHANGE: raise OSPF cost on core1->edge1 link 10 -> 100
! device: core1 (EOS-4.28.0F)
hostname core1
!
interface Loopback0
 ip address 192.0.2.1/32
!
interface Ethernet1
 no switchport
 description to core2
 ip address 10.255.0.1/30
 ip ospf cost 10
!
interface Ethernet2
 no switchport
 description to edge1
 ip address 10.255.0.5/30
 ip ospf cost 100
!
router ospf 1
 router-id 192.0.2.1
 network 10.255.0.0/24 area 0
 network 192.0.2.1/32 area 0
!
router bgp 64496
 router-id 192.0.2.1
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.2 update-source Loopback0
 neighbor 192.0.2.3 remote-as 64496
 neighbor 192.0.2.3 update-source Loopback0
!
end
