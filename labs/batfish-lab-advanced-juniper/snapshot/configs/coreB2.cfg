# coreB2 - AS64496 (SAMPLE / FICTIONAL DATA)
set system host-name coreB2
set interfaces lo0 unit 0 family inet address 192.0.2.6/32
set interfaces ge-0/0/0 unit 0 description "to coreA2"
set interfaces ge-0/0/0 unit 0 family inet address 10.255.1.26/30
set interfaces ge-0/0/1 unit 0 description "to coreB1"
set interfaces ge-0/0/1 unit 0 family inet address 10.255.1.30/30
set interfaces ge-0/0/2 unit 0 description "to edgeB1"
set interfaces ge-0/0/2 unit 0 family inet address 10.255.1.37/30
set routing-options router-id 192.0.2.6
set routing-options autonomous-system 64496
set protocols ospf area 0.0.0.0 interface lo0.0
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 metric 10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 metric 10
set protocols ospf area 0.0.0.20 interface ge-0/0/2.0 metric 10
set protocols bgp group IBGP type internal
set protocols bgp group IBGP local-address 192.0.2.6
set protocols bgp group IBGP export IBGP-EXPORT-NHS
set protocols bgp group IBGP neighbor 192.0.2.8 peer-as 64496
set policy-options policy-statement IBGP-EXPORT-NHS term BGP from protocol bgp
set policy-options policy-statement IBGP-EXPORT-NHS term BGP then next-hop self
set policy-options policy-statement IBGP-EXPORT-NHS term BGP then accept
set policy-options policy-statement IBGP-EXPORT-NHS term FINAL then reject
