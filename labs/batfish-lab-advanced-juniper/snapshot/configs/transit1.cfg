# transit1 - AS64501 (SAMPLE / FICTIONAL DATA)
set system host-name transit1
set interfaces lo0 unit 0 family inet address 198.51.100.65/26
set interfaces ge-0/0/0 unit 0 description "to edgeA1"
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.22/30
set routing-options router-id 198.51.100.65
set routing-options autonomous-system 64501
set protocols bgp group EDGEA1 type external
set protocols bgp group EDGEA1 local-address 198.51.100.22
set protocols bgp group EDGEA1 export EBGP-EXPORT
set protocols bgp group EDGEA1 neighbor 198.51.100.21 peer-as 64496
set policy-options policy-statement EBGP-EXPORT term BGP from protocol bgp
set policy-options policy-statement EBGP-EXPORT term BGP then accept
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT from protocol direct
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT from route-filter 198.51.100.64/26 exact
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT then accept
set policy-options policy-statement EBGP-EXPORT term FINAL then reject
