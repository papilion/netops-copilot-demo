# cust2 - AS64500 (SAMPLE / FICTIONAL DATA)
set system host-name cust2
set interfaces lo0 unit 0 family inet address 203.0.113.129/25
set interfaces ge-0/0/0 unit 0 description "to edgeB1"
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.14/30
set routing-options router-id 203.0.113.129
set routing-options autonomous-system 64500
set protocols bgp group EDGEB1 type external
set protocols bgp group EDGEB1 local-address 198.51.100.14
set protocols bgp group EDGEB1 export EBGP-EXPORT
set protocols bgp group EDGEB1 neighbor 198.51.100.13 peer-as 64496
set policy-options policy-statement EBGP-EXPORT term BGP from protocol bgp
set policy-options policy-statement EBGP-EXPORT term BGP then accept
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT from protocol direct
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT from route-filter 203.0.113.128/25 exact
set policy-options policy-statement EBGP-EXPORT term ORIGIN-DIRECT then accept
set policy-options policy-statement EBGP-EXPORT term FINAL then reject
